title: Ännchen von Tharau
lyrics: Simon Dach 1637, aus der samländischen Mundart übertragen von Johann Gottfried Herder 1778
music: Friedrich Silcher 1825
strophes: |+
  1.
  Ännchen von Tharau ist's, die mir gefällt,
  sie ist mein Leben, mein Gut und mein Geld.
  Ännchen von Tharau hat wieder ihr Herz
  auf mich gerichtet in Lieb und in Schmerz.
  Ännchen von Tharau, mein Reichtum, mein Gut,
  du meine Seele, mein Fleisch und mein Blut!

  2.
  Käm alles Wetter gleich auf uns zu schlahn,
  wir sind gesinnt beieinander zu stahn.
  Krankheit, Verfolgung, Betrübnis und Pein
  soll unsrer Liebe Verknötigung sein.
  Ännchen von Tharau, mein Reichtum, mein Gut,
  du meine Seele, mein Fleisch und mein Blut!

  3.
  Recht als ein Palmenbaum über sich steigt,
  hat ihn erst Regen und Sturmwind gebeut:
  so wird die Lieb, in uns mächtig und groß
  nach manchem Leiden und traurigem Los.
  Ännchen von Tharau, mein Reichtum, mein Gut,
  du meine Seele, mein Fleisch und mein Blut!

  4.
  Würdest du gleich einmal von mir getrennt,
  lebtest da, wo man die Sonne kaum kennt:
  ich will dir folgen durch Wälder, durch Meer,
  Eisen und Kerker und feindliches Heer.
  Ännchen von Tharau, mein Licht, meine Sonn!
  Mein Leben schließt sich um deines herum.
