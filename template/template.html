<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link rel="stylesheet" type="text/css" href="polar.css" />
    <link rel="stylesheet" type="text/css" href="main.css" />
  </head>
  <body>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" display="none">
        <symbol id="home" viewBox="0 0 32 32">
            <polyline points="6,30 6,14 2,18 16,4 24,12 24,4 24,12 30,18 26,14 26,30 4,30" style="fill:none;stroke-width:4"/>
        </symbol>
    </svg>
    <div id="page">
        <header>
            <div style="height:0; width:0; margin-top:-3.8rem; margin-bottom:1rem;">
                <p style="font-size:2.6rem; color:rgba(127,127,127,0.15)">LiberCantorum</p>
            </div>
            <p id="nav" class="no-print" style="width:100%; background-color:080; text-align:right; margin-top:2em; margin-bottom:-3em;">
                <a href="index.html">&nbsp;
                    <svg width="1em" height="1em" stroke="currentColor">
                        <use xlink:href="#home" />
                    </svg>
                </svg>&nbsp;</a>
            </p>
            <h1>{{ title }}</h1>
        </header>
        <main>
            {% if score is defined %}
            <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.4.0"></script>
            <img class="svg" src="{{ score }}" alt="{{ title }} - score" style="width:28rem;"><br>
            {% endif %}
            {% if file is defined %}
            <div class="midi-controls no-print" style="margin-bottom: 10px;">
                <label for="tempo-slider">Tempo: </label>
                <input type="range" id="tempo-slider" min="50" max="200" value="100" step="5" style="width: 200px;" disabled>
                <span id="tempo-value">100%</span>
            </div>
            <midi-player id="midi-player" src="{{ file }}.midi" sound-font visualizer="#myStaffVisualizer">
            </midi-player>
            <midi-visualizer type="staff" id="myStaffVisualizer" src="{{ file }}.midi" style="background-color:#fff">
            </midi-visualizer>
            <script>
                (function() {
                    const tempoSlider = document.getElementById('tempo-slider');
                    const tempoValue = document.getElementById('tempo-value');
                    const midiPlayer = document.getElementById('midi-player');
                    const visualizer = document.getElementById('myStaffVisualizer');
                    let originalSequence;
                    let tempoMultiplier = 1;

                    midiPlayer.addEventListener('load', function() {
                        originalSequence = core.sequences.clone(midiPlayer.noteSequence);
                        tempoSlider.disabled = false;
                    }, {once: true});

                    tempoSlider.addEventListener('input', function() {
                        tempoValue.textContent = this.value + '%';
                    });

                    tempoSlider.addEventListener('change', async function() {
                        const multiplier = Number(this.value) / 100;
                        if (!originalSequence || this.disabled || multiplier === tempoMultiplier) return;

                        // Keep the same musical position when replacing the sequence.
                        const position = midiPlayer.currentTime * tempoMultiplier / multiplier;
                        const wasPlaying = midiPlayer.playing;
                        tempoSlider.disabled = true;
                        midiPlayer.stop();

                        // setTempo changes the engine clock but leaves the UI in original seconds.
                        // Scale a fresh copy instead, using the player's public noteSequence API.
                        const sequence = core.sequences.clone(originalSequence);
                        sequence.totalTime /= multiplier;
                        for (const note of sequence.notes) {
                            note.startTime /= multiplier;
                            note.endTime /= multiplier;
                        }
                        for (const field of ['tempos', 'timeSignatures', 'keySignatures',
                                             'pitchBends', 'controlChanges', 'textAnnotations',
                                             'sectionAnnotations']) {
                            for (const event of sequence[field]) {
                                event.time /= multiplier;
                            }
                        }
                        for (const tempo of sequence.tempos) {
                            tempo.qpm *= multiplier;
                        }

                        const loaded = new Promise(resolve =>
                            midiPlayer.addEventListener('load', resolve, {once: true}));
                        midiPlayer.noteSequence = sequence;
                        visualizer.noteSequence = sequence;
                        await loaded;
                        midiPlayer.currentTime = position;
                        tempoMultiplier = multiplier;
                        tempoSlider.disabled = false;
                        if (wasPlaying) midiPlayer.start();
                    });
                })();
            </script>
            {% endif %}
            <p class="lyrics">{{ lyrics|safe }}</p>

        </main>

    </div>
    <footer>
        <p id="copyright" class="no-print" style="width:100%; background-color:080; text-align:right; font-size:0.6rem;">
            LiberCantorum v0.8.1dev (c) 2025 by Dirk Winkel, licensed under GPLv3 or newer
        </p>
    </footer>
  </body>
</html>
